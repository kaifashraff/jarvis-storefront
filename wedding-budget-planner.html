<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wedding Budget Planner · LAQAB</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:'Georgia',serif; background:#faf8f5; color:#2a1f1a; padding:40px 20px; }
h1 { text-align:center; color:#8b5e34; margin-bottom:6px; }
p.sub { text-align:center; color:#998877; margin-bottom:30px; }
.wrap { max-width:720px; margin:0 auto; }
.row { display:flex; gap:12px; align-items:center; padding:10px 0; border-bottom:1px solid #eee; }
.row label { flex:1; }
.row input { width:120px; padding:8px; border:1px solid #ccc; border-radius:8px; text-align:right; }
.total { text-align:center; font-size:1.4rem; font-weight:bold; color:#c8962e; margin-top:24px; }
.note { text-align:center; color:#776655; margin-top:20px; }
a { color:#25D366; }
</style>
</head>
<body>
<h1>✦ Wedding Budget Planner ✦</h1>
<p class="sub">Indian Wedding · Live Total Tracker</p>
<div class="wrap" id="planner"></div>
<div class="total" id="total">Total: ₹0</div>
<p class="note">Bridal embroidery & lehengas: <a href="https://wa.me/919987314177">wa.me/919987314177</a></p>
<script>
const cats = ["Venue & Decor","Catering","Bridal Lehenga & Embroidery","Groom's Attire","Photography & Video","Mehndi & Beauty","Invitations & Gifts","Music & Entertainment"];
const el = document.getElementById('planner');
cats.forEach(c => {
const row = document.createElement('div'); row.className='row';
row.innerHTML = `<label>${c}</label><input type="number" min="0" value="0" oninput="calc()">`;
el.appendChild(row);
});
function calc(){ let t=0; document.querySelectorAll('#planner input').forEach(i=>t+=+i.value||0); document.getElementById('total').textContent='Total: ₹'+t.toLocaleString('en-IN'); }
calc();
</script>
</body>
</html>
